
name: DevOps CI/CD Failure Analyzer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    name: Test and Analyze Failures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest -v test_analyzer

      - name: Analyze sample CI/CD failure
        run: python analyze_failure.py
