
name: Automatic CI Failure Analyzer

on:
  workflow_run:
    workflows:
      - Node.js CI
      - DevOps CI/CD Failure Analyzer
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Download Logs and Analyze
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout analyzer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$FAILED_RUN_ID" \
            --repo "$GH_REPOSITORY" \
            --log > failed-run.log

          if [ ! -s failed-run.log ]; then
            echo "No logs were retrieved from the failed workflow."
            exit 1
          fi

          echo "Retrieved failed workflow logs."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      -  name: Analyze failure
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "===== Check analyzer file ====="
          ls -l scripts/analyze_logs.py

          echo "===== Check downloaded log ====="
          ls -lh failed-run.log
          wc -l failed-run.log

          echo "===== Run analyzer ====="
          python -u scripts/analyze_logs.py
